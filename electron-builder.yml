appId: com.haruto.dokokara-karaoke
productName: どこでもカラオケセット
# .app本体の表示名(productName)は日本語のままにしたいが、Contents/MacOS/内の
# 実行ファイル名が非ASCIIだとApple Silicon実機でV8初期化中にSIGTRAPクラッシュする
# ことを確認したため、実行ファイル名だけASCIIにする(electron-builderのexecutableName)。
executableName: DokokaraKaraoke
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.music
  # Pythonサイドカー本体(PyTorch等の依存込みで数百MB〜)。asarに入れると起動時に
  # 丸ごと展開されてしまうため、asar外のResources/python-runtime/に直接配置する。
  # scripts/build-python-runtime.mjs (npm run build:python-runtime) が事前に生成する。
  extraResources:
    - from: resources/python-runtime
      to: python-runtime
    - from: python/sidecar
      to: python-sidecar
    - from: resources/models
      to: models
    - from: resources/media-tools
      to: media-tools
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: どこでもカラオケセット プロジェクト
        CFBundleTypeRole: Editor
        LSHandlerRank: Owner
        LSItemContentTypes:
          - com.haruto.dokokara-karaoke.project
        CFBundleTypeExtensions:
          - dokokara
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: com.haruto.dokokara-karaoke.project
        UTTypeDescription: どこでもカラオケセット プロジェクト
        UTTypeConformsTo:
          - public.zip-archive
        UTTypeTagSpecification:
          public.filename-extension:
            - dokokara
# 現状非対応: v3のPythonサイドカーはpython-build-standaloneのmacOS arm64版のみを前提に
# ビルドしており(scripts/build-python-runtime.mjs)、以下のwin:ターゲット/npm run build:winは
# 実行してもPythonサイドカーが同梱されず動作しない。設定自体は将来Windows向けPython
# ランタイムを用意する可能性に備えて残す([[どこカラv3の技術選定]]参照)。
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
dmg:
  sign: false
  # 未指定だとexecutableName(ローマ字)がマウント時のボリューム名・ウィンドウタイトルに
  # 使われてしまうため、productName(日本語)を明示する。
  title: ${productName} ${version}
# electron-builderはelectron fusesの書き込みをafterPack "の後"に行うため、
# afterPackで署名するとfuses書き込み時にバイナリが変更され署名が壊れる(実機で確認済み)。
# fuses書き込み後に確実に走るafterSignで署名する。
afterSign: build/afterSign.cjs
# electron-builderが既定で有効化するElectron Fuses(embeddedAsarIntegrityValidation等)が、
# 実機でSIGTRAPクラッシュを引き起こすことを検証で確認したため無効化する。
# ad-hoc署名かつ2名限定配布のためasar改ざん検知等のハードニングは必須ではない。
electronFuses:
  runAsNode: false
  enableCookieEncryption: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: false
  onlyLoadAppFromAsar: false
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
